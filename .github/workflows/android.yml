name: Build Android APK

# สร้างไฟล์ APK (Trusted Web Activity ที่เปิด https://byd-yard-sjwd.pages.dev)
# รันเองจากแท็บ Actions หรืออัตโนมัติเมื่อโฟลเดอร์ android/ เปลี่ยน
# ผลลัพธ์: Releases → "android-latest" → sjwd-yard-control.apk
#
# ไม่ต้อง build ใหม่ทุกครั้งที่แก้เว็บ — แอปดึงเวอร์ชันล่าสุดจากเว็บเอง

on:
  workflow_dispatch: {}
  push:
    branches: [main]
    paths:
      - 'android/**'
      - '.github/workflows/android.yml'

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.14.3

      - name: Build release APK
        working-directory: android
        env:
          ANDROID_VERSION_CODE: ${{ github.run_number }}
          ANDROID_VERSION_NAME: 1.${{ github.run_number }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: gradle assembleRelease --no-daemon --console=plain

      - name: Collect APK
        run: |
          cp android/app/build/outputs/apk/release/app-release.apk sjwd-yard-control.apk
          ls -la sjwd-yard-control.apk

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: sjwd-yard-control-apk
          path: sjwd-yard-control.apk

      - name: Publish to Releases (android-latest)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: android-latest
          name: SJWD Yard Control — Android APK
          body: |
            ไฟล์ติดตั้ง Android ของ SJWD Yard Control (build #${{ github.run_number }})

            **วิธีติดตั้ง:** ดาวน์โหลด `sjwd-yard-control.apk` ลงมือถือ → เปิดไฟล์ → อนุญาต "ติดตั้งจากแหล่งที่ไม่รู้จัก" ถ้าเครื่องถาม → ติดตั้ง

            แอปเปิดเว็บ https://byd-yard-sjwd.pages.dev แบบเต็มจอด้วย Chrome
            อัปเดตเวอร์ชันแอปมาจากเว็บอัตโนมัติ (ปุ่ม 🚀 อัปเดตเลย) ไม่ต้องติดตั้ง APK ใหม่
          files: sjwd-yard-control.apk
